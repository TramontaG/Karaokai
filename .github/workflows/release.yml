name: Publish release candidate

on:
  push:
    tags:
      - "v*-rc.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v*-rc.* tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Windows release candidate
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package versions match
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tagName = "${{ inputs.release_tag || github.ref_name }}"
          if ($tagName -notmatch '^v.+-rc\..+$') {
            throw "Release tag $tagName must match v*-rc.*."
          }
          $tagVersion = $tagName.TrimStart("v")
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match package version $packageVersion."
          }

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ELECTRON_BUILDER_PUBLISH: never
        run: npm run build:windows

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "KaraokAI-*-win-x64.exe" | Select-Object -First 1
          if ($null -eq $installer) {
            throw "Windows installer was not produced."
          }
          $hash = Get-FileHash -Algorithm SHA256 $installer.FullName
          "{0}  {1}" -f $hash.Hash.ToLowerInvariant(), $installer.Name | Set-Content -NoNewline release/checksums.txt

      # SignPath verifies that the signing input was first retained by GitHub.
      # Keep this artifact name stable when adding SignPath after approval.
      - name: Upload unsigned installer for signing
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-installer
          path: |
            release/KaraokAI-*-win-x64.exe
            release/checksums.txt
          if-no-files-found: error
          retention-days: 90

      - name: Create unsigned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        shell: pwsh
        run: |
          @"
          ## Windows signing status

          The Windows installer in this release is currently unsigned. Code
          signing is being set up through SignPath Foundation.

          Verify downloads using `checksums.txt`.

          Code signing policy:
          https://github.com/TramontaG/Karaokai#code-signing-policy
          "@ | Set-Content release-notes.md

          gh release create $env:TAG_NAME `
            release/KaraokAI-*-win-x64.exe `
            release/checksums.txt `
            --title "KaraokAI $env:TAG_NAME" `
            --notes-file release-notes.md `
            --prerelease
