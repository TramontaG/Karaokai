name: Publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable vX.Y.Z tag to publish or update
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package versions match
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tagName = "${{ inputs.release_tag || github.ref_name }}"
          if ($tagName -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag $tagName must match vX.Y.Z (for example, v1.0.0)."
          }
          $tagVersion = $tagName.TrimStart("v")
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match package version $packageVersion."
          }

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build && npx electron-builder --win nsis --x64 --publish never

      # SignPath verifies that the signing input was first retained by GitHub.
      # Keep this artifact name stable when adding SignPath after approval.
      - name: Upload unsigned installer for signing
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-installer
          path: release/KaraokAI-*-win-x64.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-windows
          path: release/KaraokAI-*-win-x64.exe
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux x64 packages
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --test tests/*.test.mjs

      - name: Build Linux packages
        run: npm run build && npx electron-builder --linux AppImage deb --x64 --publish never

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-linux
          path: |
            release/KaraokAI-*-linux-x86_64.AppImage
            release/KaraokAI-*-linux-amd64.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged changelog
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd release
          sha256sum KaraokAI-*-win-x64.exe \
            KaraokAI-*-linux-x86_64.AppImage \
            KaraokAI-*-linux-amd64.deb > checksums.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 - <<'PY' > release-notes.md
          import os
          import re
          from pathlib import Path

          version = os.environ["TAG_NAME"].removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text()
          entry = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |^\[\d|\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if not entry:
              raise SystemExit(f"Missing changelog entry for {version}")
          print(entry.group(1).strip() + "\n")
          PY

          cat >> release-notes.md <<'EOF'
          ## Downloads

          - Windows x64: NSIS installer
          - Linux x64: AppImage and Debian package

          ## Windows signing status

          The Windows installer in this release is currently unsigned. Code
          signing is being set up through SignPath Foundation.

          Verify all downloads using `checksums.txt`.

          Code signing policy:
          https://github.com/TramontaG/Karaokai#code-signing-policy
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/* --clobber
            gh release edit "$TAG_NAME" --title "KaraokAI $TAG_NAME" \
              --notes-file release-notes.md --latest
          else
            gh release create "$TAG_NAME" release/* --title "KaraokAI $TAG_NAME" \
              --notes-file release-notes.md --latest
          fi
