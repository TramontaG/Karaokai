[project]
name = "karaoke-worker"
version = "0.1.0"
description = "Isolated local processing worker for KaraokAI"
requires-python = ">=3.11,<3.12"
dependencies = [
  "demucs==4.0.1",
  "faster-whisper==1.1.0",
  "whisperx==3.3.1",
  "setuptools>=68,<82",
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "matplotlib==3.9.2"
]

[project.scripts]
karaoke-worker = "karaoke_worker.__main__:main"

[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["karaoke_worker*"]
