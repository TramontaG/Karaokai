appId: com.karaokai.app
productName: KaraokAI
asar: true

directories:
  output: release

files:
  - dist/**/*
  - electron/**/*
  - package.json

extraResources:
  - from: worker
    to: worker

linux:
  category: AudioVideo
  icon: src-tauri/icons/icon.png
  syncDesktopName: true
  target:
    - AppImage
    - deb

mac:
  icon: src-tauri/icons/icon.icns
  target: dmg

win:
  icon: src-tauri/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: appx
      arch:
        - x64

# Before submitting to Microsoft Store, replace identityName with the exact
# Package/Identity name reserved for KaraokAI in Partner Center.
appx:
  identityName: com.karaokai.app
  applicationId: KaraokAI
  displayName: KaraokAI
  languages:
    - pt-BR
    - en-US

artifactName: ${productName}-${version}-${os}-${arch}.${ext}
